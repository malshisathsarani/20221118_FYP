name: mental_health_chatbot
description: Mental Health Chatbot with AI-powered emotion detection and crisis support
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI & Icons
  cupertino_icons: ^1.0.2
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.9

  # State Management
  provider: ^6.1.1

  # Routing
  go_router: ^13.0.0

  # HTTP & API
  http: ^1.1.2
  dio: ^5.4.0
  universal_html: ^2.2.4

  # Local Storage
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0

  # Audio Recording & Playback
  audioplayers: ^5.2.1
  record: ^5.0.4  # Audio recording
  path_provider: ^2.1.1
  permission_handler: ^11.1.0

  # JSON & Models
  json_annotation: ^4.8.1

  # Utils
  intl: ^0.19.0
  equatable: ^2.0.5
  url_launcher: ^6.2.2

  # Loading & Animations
  flutter_spinkit: ^5.2.0
  shimmer: ^3.0.0
  lottie: ^3.0.0

  vector_math: any
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.7
  json_serializable: ^6.7.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/audio/
